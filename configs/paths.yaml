# Default paths (relative to the repository root). Put machine-specific paths in configs/paths.local.yaml
# (see paths.local.example.yaml; ignored by git) or in the STARK_CLEAN_<KEY> environment variables.
checkpoints: checkpoints              # <checkpoints>/<stark_st2|stark_s>/<model_config>/<file>.pth.tar
dataset: data/votlt2020/sequences     # test: VOT-format sequences <dataset>/<sequence>/{color/, groundtruth.txt, sequence}
dataset_cache:                        # test, optional: keep a copy (<sequence>.tar) of every downloaded sequence here
outputs: outputs                      # test: one folder per experiment
train_data: data/train                # train: <train_data>/{got10k/train, coco, lasot, trackingnet}
train_outputs: outputs/training       # train: one folder per training run
