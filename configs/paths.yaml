# Default paths (relative to the repository root). Usually no change is needed on Vast.ai / Colab.
# To use different locations on your own machine, do NOT edit this file; create configs/paths.local.yaml
# instead (copy paths.local.example.yaml). That file is ignored by git.
checkpoints: checkpoints              # <checkpoints>/<stark_st2|stark_s>/<model_config>/<file>.pth.tar
dataset: data/votlt2020/sequences     # VOT-format sequences: <dataset>/<sequence>/{color/, groundtruth.txt, sequence}
outputs: outputs                      # Each experiment is written to <outputs>/<experiment name>/
train_data: data/train                # Training datasets: <train_data>/{got10k/train, coco, lasot, trackingnet}
train_outputs: outputs/training       # Each training run is written to <train_outputs>/<run name>/
