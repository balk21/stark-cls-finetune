# python -m stark_ft test --config configs/test_example.yaml [--set ft_samples=posneg --set weights=<stage-2 run name>]
# Parameters that are not listed take their default values (docs/test.md).
model: stark_st
model_config: baseline_R101
weights: official          # or a stage-2 run trained here (python -m stark_ft weights)
sequences: [bull]         # downloaded automatically; all = the 50 VOT-LT2020 sequences
update_interval: 100
ft_mode: online
ft_samples: pos
ft_lr: 1.0e-4
ft_epochs_init: 15
ft_epochs_online: 1
seed: 0
